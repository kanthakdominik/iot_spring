# Production (Docker Compose on Oracle Cloud).
# Secrets and addresses come from environment variables (deploy/docker-compose.yml + deploy/.env):
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_PASSWORD, APP_ADMIN_PASSWORD,
#   MQTT_ENABLED, MQTT_BROKER_URL, MQTT_CERT_DIR, APP_CORS_ALLOWED_ORIGINS

# HTTPS is terminated by Caddy - trust X-Forwarded-* headers and send the session cookie only over HTTPS
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true

logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
