# Local development: TimescaleDB started with
#   docker run -d --name iot-db -p 5432:5432 -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=iot timescale/timescaledb:2.30.0-pg18
spring.datasource.url=jdbc:postgresql://localhost:5432/iot
spring.datasource.username=postgres
spring.datasource.password=postgres

# local admin account (only created on an empty database)
app.admin.password=admin

mqtt.enabled=false
