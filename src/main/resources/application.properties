spring.application.name=iot-spring
# profile used when SPRING_PROFILES_ACTIVE is not set
spring.profiles.default=local

# ---------- database (PostgreSQL 18 + TimescaleDB), schema owned by Flyway ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/iot
spring.datasource.username=postgres
spring.datasource.password=
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---------- web ----------
spring.mvc.problemdetails.enabled=true
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# only needed when the frontend runs on another origin (comma separated)
app.cors.allowed-origins=http://localhost:4200

# ---------- first administrator (created only when the users table is empty) ----------
app.admin.username=admin
app.admin.password=

# ---------- actuator: only /api/actuator/health, without details ----------
management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---------- MQTT (Mosquitto, TLS + client certificate) ----------
mqtt.enabled=false
mqtt.broker-url=ssl://localhost:8883
mqtt.client-id=iot_spring
# directory with ca-cert.pem, client-cert.pem, client-key.pem
mqtt.cert-dir=

logging.level.root=INFO
