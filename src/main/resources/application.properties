spring.application.name=iot-spring
# profile used when SPRING_PROFILES_ACTIVE is not set
spring.profiles.default=local

# ---------- database (PostgreSQL 18 + TimescaleDB), schema owned by Flyway ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/iot
spring.datasource.username=postgres
spring.datasource.password=
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---------- threads: virtual threads for requests, @Scheduled jobs and async work ----------
spring.threads.virtual.enabled=true

# ---------- web ----------
spring.mvc.problemdetails.enabled=true
# SD card import (POST /api/devices/{id}/import): up to 20 files, 50 MB together
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB
# Tomcat limits the number of parts of a multipart request
server.tomcat.max-part-count=50
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# only needed when the frontend runs on another origin (comma separated)
app.cors.allowed-origins=http://localhost:4200

# ---------- application ----------
# time zone of "days" (activity calendar, plain dates in query parameters)
app.timezone=Europe/Warsaw
# public address of the frontend (links in push notifications)
app.public-url=http://localhost:4200

# ---------- push notifications through ntfy (https://ntfy.sh), disabled when the URL is empty ----------
# e.g. https://ntfy.sh/<random-topic>; the token is only needed for a protected topic / own server
app.notify.ntfy.url=
app.notify.ntfy.token=

# ---------- first administrator (created only when the users table is empty) ----------
app.admin.username=admin
app.admin.password=

# ---------- actuator: only /api/actuator/health, without details ----------
management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---------- MQTT (Mosquitto, TLS + client certificate) ----------
mqtt.enabled=false
mqtt.broker-url=ssl://localhost:8883
mqtt.client-id=iot_spring
# directory with ca-cert.pem, client-cert.pem, client-key.pem
mqtt.cert-dir=

logging.level.root=INFO
