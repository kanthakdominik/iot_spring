# Eclipse Mosquitto 2 - TLS only, every client needs a certificate signed by our CA
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate true
# The certificate CN (esp32-1, iot_spring, ...) becomes the MQTT username
use_identity_as_username true
allow_anonymous false

# who may publish / subscribe to which topics (docs/PROTOCOL.md)
acl_file /mosquitto/config/acl
