# CI for the frontend: on every push / pull request GitHub installs dependencies
# and makes a production build (catches TypeScript / template errors and bundle-size budget overruns).
name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npx ng build --configuration production
